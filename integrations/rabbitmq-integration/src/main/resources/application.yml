spring:
  application:
    name: rabbitmq
  rabbitmq:
    host: localhost
    port: 5672
    username: user
    password: password
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 3s
          max-attempts: 3
          max-interval: 10s
          multiplier: 2
app:
  exchanges:
    - name: spring.rabbitmq
      queue:
        - routing-key: 'queue.one'
          name: 'spring.raabitmq.queue.one'
        - routing-key: 'queue.two'
          name: 'spring.rabbitmq.queue.two'